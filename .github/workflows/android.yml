
name: Build 405 Doctor APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '405Doctor_source_v0.1.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip 405Doctor_source_v0.1.zip
          cp -a 405Doctor/. .
      - name: Fix AlertDialog import
        run: |
          sed -i '/^package /a import android.app.AlertDialog' app/src/main/java/com/example/fivedoct/MainActivity.kt
      - name: Fix JVM target
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.fivedoct"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.fivedoct"
                  minSdk = 23
                  targetSdk = 30
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
      - name: Find Gradle files
        run: |
          find . -name "build.gradle" -o -name "build.gradle.kts"
      - name: Show app settings
        run: cat app/build.gradle.kts
        
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 405Doctor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
